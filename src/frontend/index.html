<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Conversion &amp; Audit Trail</title>
    <!--
      Runtime configuration injection point.
      The `__VITE_API_URL__` token is replaced by the container entrypoint
      script at start-up using the runtime VITE_API_URL environment variable.
      An empty string means "same origin", which is expected when Nginx
      proxies /api/* to the backend in the sidecar container.
    -->
    <script>
      window.__RUNTIME_CONFIG__ = {
        VITE_API_URL: "__VITE_API_URL__"
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
